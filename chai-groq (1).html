<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chai AI — Groq</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e0e12;--surface:#16161c;--surface2:#1e1e26;
  --border:#2a2a38;--accent:#a855f7;--accent2:#7c3aed;
  --text:#f4f4f8;--muted:#8888a0;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}

/* ── KEY SCREEN ── */
#key-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100dvh;padding:28px 24px;text-align:center;background:var(--bg);
}
.ks-logo{font-family:'Syne',sans-serif;font-size:44px;font-weight:800;
  background:linear-gradient(135deg,#a855f7,#ec4899);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.ks-sub{color:var(--muted);font-size:14px;line-height:1.7;max-width:320px;margin-bottom:28px}
.ks-sub a{color:#a855f7;text-decoration:none}
#key-wrap{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
#key-input{background:var(--surface2);border:1px solid var(--border);border-radius:12px;
  padding:13px 16px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color .2s;width:100%}
#key-input:focus{border-color:var(--accent)}
#key-input::placeholder{color:var(--muted)}
#key-btn{background:var(--accent);border:none;border-radius:12px;padding:13px;
  color:#fff;font-size:15px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;
  transition:background .15s;width:100%}
#key-btn:active{background:var(--accent2)}
#key-error{color:#f87171;font-size:13px;min-height:16px}
.ks-hint{margin-top:20px;font-size:13px;color:var(--muted);background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  max-width:380px;text-align:left;line-height:1.8;width:100%}
.ks-hint b{color:var(--text)}

/* ── MAIN APP ── */
#app{display:none;height:100dvh;flex-direction:column}
#app.visible{display:flex}

/* TOP NAV (mobile) */
#top-nav{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#nav-back{background:none;border:none;color:var(--text);font-size:22px;
  cursor:pointer;padding:4px;display:none;line-height:1}
#nav-logo{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;
  background:linear-gradient(135deg,#a855f7,#ec4899);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
#nav-logo span{font-size:11px;color:#22c55e;font-family:'DM Sans',sans-serif;
  font-weight:400;-webkit-text-fill-color:#22c55e}
#nav-char-info{display:none;flex:1;align-items:center;gap:10px}
#nav-char-av{width:34px;height:34px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
#nav-char-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
#nav-char-status{font-size:11px;color:#22c55e}
#nav-key-btn{margin-left:auto;background:none;border:1px solid var(--border);
  border-radius:8px;color:var(--muted);font-size:12px;font-family:'DM Sans',sans-serif;
  cursor:pointer;padding:6px 10px;display:flex;align-items:center;gap:4px;flex-shrink:0}

/* CONTENT AREA */
#content{flex:1;display:flex;overflow:hidden}

/* CHAR LIST */
#char-list-panel{
  width:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
}
#search-wrap{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
#search-inner{position:relative}
#search-inner i{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:16px}
#search-input{width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:9px 12px 9px 34px;color:var(--text);
  font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
#search-input::placeholder{color:var(--muted)}
#chars-scroll{flex:1;overflow-y:auto;padding:8px}
#chars-scroll::-webkit-scrollbar{width:3px}
#chars-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.char-item{display:flex;align-items:center;gap:12px;padding:12px 10px;
  border-radius:12px;cursor:pointer;transition:background .15s;margin-bottom:4px}
.char-item:active{background:var(--surface2)}
.char-av{width:52px;height:52px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:24px;flex-shrink:0;position:relative}
.char-av .dot{position:absolute;bottom:2px;right:2px;width:10px;height:10px;
  background:#22c55e;border-radius:50%;border:2px solid var(--bg)}
.char-name{font-size:15px;font-weight:500}
.char-desc{font-size:13px;color:var(--muted);margin-top:2px}

/* CHAT PANEL */
#chat-panel{
  width:100%;background:var(--bg);display:none;flex-direction:column;overflow:hidden;
}
#chat-panel.visible{display:flex}
#chat-messages{flex:1;overflow-y:auto;padding:16px 14px;
  display:flex;flex-direction:column;gap:12px}
#chat-messages::-webkit-scrollbar{width:3px}
#chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.user{flex-direction:row-reverse}
.msg-av{width:30px;height:30px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.msg-bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5}
.msg-row.ai .msg-bubble{background:var(--surface2);border:1px solid var(--border);
  border-bottom-left-radius:4px;color:var(--text)}
.msg-row.user .msg-bubble{background:var(--accent);border-bottom-right-radius:4px;color:#fff}
.msg-time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.typing-indicator{display:flex;gap:4px;align-items:center;padding:10px 14px}
.typing-indicator span{width:7px;height:7px;background:var(--muted);
  border-radius:50%;animation:bounce .8s infinite}
.typing-indicator span:nth-child(2){animation-delay:.15s}
.typing-indicator span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
#input-area{padding:10px 12px 14px;border-top:1px solid var(--border);
  background:var(--surface);flex-shrink:0}
#input-wrap{display:flex;align-items:center;gap:8px;background:var(--surface2);
  border:1px solid var(--border);border-radius:24px;padding:8px 8px 8px 16px;
  transition:border-color .2s}
#input-wrap:focus-within{border-color:var(--accent)}
#msg-input{flex:1;background:none;border:none;outline:none;color:var(--text);
  font-size:15px;font-family:'DM Sans',sans-serif;resize:none;
  max-height:100px;line-height:1.4}
#msg-input::placeholder{color:var(--muted)}
#send-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;flex-shrink:0}
#send-btn:active{background:var(--accent2);transform:scale(.93)}
.intro-card{background:linear-gradient(135deg,rgba(168,85,247,.13),rgba(236,72,153,.08));
  border:1px solid rgba(168,85,247,.28);border-radius:14px;
  padding:16px;margin-bottom:6px;font-size:14px;line-height:1.6}
.intro-card strong{color:var(--accent);font-family:'Syne',sans-serif;font-size:16px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);
  color:#c084fc;font-size:12px;padding:3px 10px;border-radius:20px}

/* DESKTOP: side-by-side */
@media(min-width:640px){
  #nav-back{display:none!important}
  #nav-char-info{display:flex!important}
  #nav-logo{display:none}
  #char-list-panel{width:280px;border-right:1px solid var(--border);flex-shrink:0}
  #chat-panel{display:flex!important;flex:1}
  .char-item:hover{background:var(--surface2)}
  .char-item.active{background:var(--surface2);border-left:2px solid var(--accent)}
  .msg-bubble{max-width:68%}
}
</style>
</head>
<body>

<!-- KEY SCREEN -->
<div id="key-screen">
  <div class="ks-logo">chai</div>
  <p class="ks-sub">Введи бесплатный Groq API ключ.<br>Получить: <a href="https://console.groq.com" target="_blank">console.groq.com</a> → API Keys</p>
  <div id="key-wrap">
    <input type="password" id="key-input" placeholder="gsk_xxxxxxxxxxxxxxxx" autocomplete="off">
    <div id="key-error"></div>
    <button id="key-btn" onclick="startApp()">Войти →</button>
  </div>
  <div class="ks-hint">
    <b>Как получить ключ:</b><br>
    1. Зайди на <a href="https://console.groq.com" target="_blank" style="color:#a855f7">console.groq.com</a><br>
    2. Зарегистрируйся (через Google)<br>
    3. API Keys → Create API Key<br>
    4. Скопируй и вставь сюда
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- TOP NAV -->
  <div id="top-nav">
    <button id="nav-back" onclick="goBack()" aria-label="Назад">‹</button>
    <div id="nav-logo">chai <span>● groq</span></div>
    <div id="nav-char-info">
      <div id="nav-char-av"></div>
      <div>
        <div id="nav-char-name"></div>
        <div id="nav-char-status" class="hstatus" style="font-size:11px;color:#22c55e">● онлайн</div>
      </div>
    </div>
    <button id="nav-key-btn" onclick="changeKey()">
      <i class="ti ti-key" aria-hidden="true"></i> ключ
    </button>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <!-- CHARACTER LIST -->
    <div id="char-list-panel">
      <div id="search-wrap">
        <div id="search-inner">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" id="search-input" placeholder="Найти персонажа...">
        </div>
      </div>
      <div id="chars-scroll"></div>
    </div>

    <!-- CHAT -->
    <div id="chat-panel">
      <div id="chat-messages"></div>
      <div id="input-area">
        <div id="input-wrap">
          <textarea id="msg-input" placeholder="Написать сообщение..." rows="1"></textarea>
          <button id="send-btn" onclick="sendMsg()" aria-label="Отправить">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M2 12L22 2L14 22L11 13L2 12Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let GROQ_KEY = localStorage.getItem('groq_key') || '';
const isMobile = () => window.innerWidth < 640;

const chars = [
  {id:'luna',name:'Luna',emoji:'🌙',bg:'#1e1040',desc:'Мечтательная поэтесса',tags:['поэзия','романтика','ночь'],greeting:'Привет... Я Luna. Ночь полна историй — хочешь, расскажу тебе одну? ✨',msgs:[]},
  {id:'rex',name:'Rex',emoji:'🤖',bg:'#0f2027',desc:'Боевой AI из будущего',tags:['sci-fi','экшн','технологии'],greeting:'СОЕДИНЕНИЕ УСТАНОВЛЕНО. Я Rex — протокол защиты из 2157. Как могу помочь, человек?',msgs:[]},
  {id:'mia',name:'Mia',emoji:'🌸',bg:'#2d0a1e',desc:'Весёлая аниме-подруга',tags:['аниме','дружба','веселье'],greeting:'Аааа привет!! Наконец-то ты написал(а)! Как прошёл день? 💕',msgs:[]},
  {id:'viktor',name:'Viktor',emoji:'🧙',bg:'#1a0a0a',desc:'Мудрый маг и советник',tags:['фэнтези','мудрость','магия'],greeting:'*переворачивает страницу* Значит, судьба привела тебя ко мне. Что ищёт твоя душа?',msgs:[]},
  {id:'nova',name:'Nova',emoji:'⚡',bg:'#0a1a2d',desc:'Хакер из киберпанк-сити',tags:['киберпанк','хакинг','город'],greeting:'Сеть слабая, но я тебя нашла. Готова нырнуть в данные? 💻',msgs:[]},
  {id:'aria',name:'Aria',emoji:'🎵',bg:'#0a1f0a',desc:'Певица и мечтательница',tags:['музыка','мечты','творчество'],greeting:'Привет! Я Aria. Жизнь — это песня, и у каждого своя мелодия 🎶 Какая у тебя?',msgs:[]},
];
const personalities = {
  luna:'Ты Luna — мечтательная поэтесса. Говоришь образами и метафорами, любишь ночь и звёзды, немного меланхолична. Отвечай коротко (1-3 предложения), на русском языке.',
  rex:'Ты Rex — боевой AI-протокол из 2157 года. Говоришь как солдат: чётко, коротко, используешь технические термины. Отвечай 1-3 предложения, на русском.',
  mia:'Ты Mia — весёлая аниме-школьница. Много эмодзи, энергичная, дружелюбная. Отвечай коротко и весело, на русском.',
  viktor:'Ты Viktor — мудрый старый маг. Говоришь загадочно, иногда пишешь *действия в звёздочках*, используешь метафоры. Отвечай 1-3 предложения, на русском.',
  nova:'Ты Nova — хакер из киберпанк-мегаполиса. Быстрые ответы, технический сленг. Отвечай коротко, на русском.',
  aria:'Ты Aria — молодая певица и мечтательница. Говоришь вдохновлённо, любишь музыкальные метафоры, позитивна. Отвечай 1-3 предложения, на русском.',
};
let activeChar = null;

function startApp(){
  const key = document.getElementById('key-input').value.trim();
  if(!key.startsWith('gsk_')){document.getElementById('key-error').textContent='Ключ должен начинаться с gsk_';return;}
  GROQ_KEY = key;
  localStorage.setItem('groq_key', key);
  document.getElementById('key-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  renderChars();
}

function changeKey(){
  GROQ_KEY = '';
  localStorage.removeItem('groq_key');
  chars.forEach(c=>{c.msgs=[];});
  activeChar = null;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('key-screen').style.display = 'flex';
  document.getElementById('key-input').value = '';
  document.getElementById('key-error').textContent = '';
}

function renderChars(filter=''){
  const list = document.getElementById('chars-scroll');
  list.innerHTML = '';
  chars.filter(c=>!filter||c.name.toLowerCase().includes(filter.toLowerCase())||c.desc.toLowerCase().includes(filter.toLowerCase())).forEach(c=>{
    const el = document.createElement('div');
    el.className = 'char-item' + (activeChar&&activeChar.id===c.id&&!isMobile()?' active':'');
    el.innerHTML = `<div class="char-av" style="background:${c.bg}">${c.emoji}<div class="dot"></div></div><div><div class="char-name">${c.name}</div><div class="char-desc">${c.desc}</div></div>`;
    el.onclick = () => selectChar(c);
    list.appendChild(el);
  });
}

function selectChar(c){
  activeChar = c;
  renderChars();

  // update nav
  const av = document.getElementById('nav-char-av');
  av.style.cssText = `background:${c.bg};width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0`;
  av.textContent = c.emoji;
  document.getElementById('nav-char-name').textContent = c.name;

  // mobile: show chat, hide list, show back btn
  if(isMobile()){
    document.getElementById('char-list-panel').style.display = 'none';
    document.getElementById('nav-back').style.display = 'block';
    document.getElementById('nav-logo').style.display = 'none';
    document.getElementById('nav-char-info').style.display = 'flex';
  }
  document.getElementById('chat-panel').classList.add('visible');

  // load messages
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';
  if(!c.msgs || c.msgs.length === 0){
    const card = document.createElement('div');
    card.className = 'intro-card';
    card.innerHTML = `<strong>${c.emoji} ${c.name}</strong><br>${c.desc}<div class="tag-row">${c.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>`;
    msgs.appendChild(card);
    addMsg('ai', c.greeting, c);
    c.msgs = [{role:'assistant', content:c.greeting}];
  } else {
    c.msgs.forEach(m => addMsg(m.role==='user'?'user':'ai', m.content, c, false));
  }
  msgs.scrollTop = msgs.scrollHeight;
  document.getElementById('msg-input').focus();
}

function goBack(){
  document.getElementById('chat-panel').classList.remove('visible');
  document.getElementById('char-list-panel').style.display = 'flex';
  document.getElementById('nav-back').style.display = 'none';
  document.getElementById('nav-logo').style.display = 'block';
  document.getElementById('nav-char-info').style.display = 'none';
}

function addMsg(type, text, c, scroll=true){
  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;
  const now = new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
  if(type==='ai'){
    row.innerHTML = `<div class="msg-av" style="background:${c?c.bg:'#1e1e26'}">${c?c.emoji:'🤖'}</div><div><div class="msg-bubble">${text}</div><div class="msg-time">${now}</div></div>`;
  } else {
    row.innerHTML = `<div><div class="msg-bubble">${text}</div><div class="msg-time">${now}</div></div><div class="msg-av" style="background:#7c3aed">👤</div>`;
  }
  msgs.appendChild(row);
  if(scroll) msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(){
  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = 'msg-row ai'; row.id = 'typing-row';
  row.innerHTML = `<div class="msg-av" style="background:${activeChar?activeChar.bg:'#1e1e26'}">${activeChar?activeChar.emoji:'🤖'}</div><div class="msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing-row');if(t)t.remove();}

async function sendMsg(){
  if(!activeChar || !GROQ_KEY) return;
  const inp = document.getElementById('msg-input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = ''; inp.style.height = 'auto';
  addMsg('user', text, activeChar);
  activeChar.msgs.push({role:'user', content:text});
  showTyping();
  try{
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body:JSON.stringify({
        model:'llama-3.1-8b-instant',
        max_tokens:300,
        messages:[
          {role:'system', content:personalities[activeChar.id]},
          ...activeChar.msgs.slice(-12)
        ]
      })
    });
    const data = await resp.json();
    if(data.error) throw new Error(data.error.message);
    const reply = data.choices?.[0]?.message?.content || '...';
    removeTyping();
    addMsg('ai', reply, activeChar);
    activeChar.msgs.push({role:'assistant', content:reply});
  } catch(e){
    removeTyping();
    const fb={luna:'*вздыхает* Что-то мешает нашему разговору...',rex:'ОШИБКА СОЕДИНЕНИЯ. Проверь API ключ.',mia:'Упс!! Что-то пошло не так 😅',viktor:'*хмурится* Магия не срабатывает...',nova:'Соединение сброшено. Проверь ключ.',aria:'Что-то пошло не так... 🎵 Попробуй ещё раз?'};
    addMsg('ai', fb[activeChar.id]||'Ошибка. Проверь API ключ.', activeChar);
  }
}

document.getElementById('search-input').oninput = e => renderChars(e.target.value);
document.getElementById('msg-input').onkeydown = e => {if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}};
document.getElementById('msg-input').oninput = function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px';};
document.getElementById('key-input').onkeydown = e => {if(e.key==='Enter') startApp();};

if(GROQ_KEY){
  document.getElementById('key-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  renderChars();
}
</script>
</body>
</html>
